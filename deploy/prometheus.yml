# Prometheus for `docker compose --profile observability`.
# The webhook server answers /metrics only with METRICS_TOKEN as a bearer
# token; compose mounts it from .env as the secret below.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: tg-business-kit
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["webhook:8000"]
