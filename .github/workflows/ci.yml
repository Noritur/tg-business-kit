name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_test
      # Postgres tests must run here, not be skipped.
      KIT_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      # No secrets needed: Telegram and Gemini are faked, network is blocked.
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m kit validate presets/*.json

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag tg-business-kit:ci .
      - name: image starts and refuses to run without a token
        run: |
          set +e
          out=$(docker run --rm tg-business-kit:ci 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 2 && echo "$out" | grep -q "TELEGRAM_BOT_TOKEN"
